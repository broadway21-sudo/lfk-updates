name: Publish Autopark UA v1.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-autopark-v14.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified private build artifact
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 2 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-220c-820a-bfca-030235c47537/raw?se=2026-09-25T10%3A41%3A20Z&sp=r&sv=2026-02-06&sr=b&scid=b9c9ae01-c315-591f-b003-82d4692a5260&skoid=061609b8-1cdb-4a5b-9e68-c7ab9a523a8f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-25T09%3A55%3A07Z&ske=2026-09-26T09%3A55%3A07Z&sks=b&skv=2026-02-06&sig=YsPCIOqqbOIGzY1qvqjZsPBjQjjGtZYSfMMYMzTRZSc%3D' -o /tmp/autopark-v14.zip
          echo 'd6de03bb75131f37e84f0ed9268c5351317f8c852f464e45fefc5e6c2792aec2  /tmp/autopark-v14.zip' | sha256sum -c -
          rm -rf /tmp/autopark-v14
          mkdir -p /tmp/autopark-v14
          unzip -q /tmp/autopark-v14.zip -d /tmp/autopark-v14
          test -s /tmp/autopark-v14/app-debug.apk
          echo '822f4eb7e6b1d5418eb45963d720c68ef936120ae53e0ff523dd1c41f54431c1  /tmp/autopark-v14/app-debug.apk' | sha256sum -c -
      - name: Publish APK and update feed
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p downloads autopark
          cp /tmp/autopark-v14/app-debug.apk downloads/autopark-v1.4.0.apk
          cat > autopark/latest.json <<'JSON'
          {
            "versionCode": 14,
            "versionName": "1.4.0",
            "apkUrl": "https://broadway21-sudo.github.io/lfk-updates/downloads/autopark-v1.4.0.apk",
            "sha256": "822f4eb7e6b1d5418eb45963d720c68ef936120ae53e0ff523dd1c41f54431c1",
            "notes": "Безпечне автооновлення, перевірка SHA-256, оперативний дашборд і аналітика власника.",
            "mandatory": false
          }
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/autopark-v1.4.0.apk autopark/latest.json
          git diff --cached --quiet || git commit -m 'Publish Autopark UA v1.4.0'
          git push
